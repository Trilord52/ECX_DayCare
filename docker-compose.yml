services:
  db:
    image: postgres:16
    container_name: daycare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: daycare
      POSTGRES_PASSWORD: daycare_dev
      POSTGRES_DB: daycare
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daycare -d daycare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
